<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structural Racism</title>
<style>
  :root {
    --a: #667eea; --b: #764ba2; --ink: #2c3250; --soft: #646b8a; --line: #e6e8f2;
    --tint: #f3f4fb; --yes: #1c8a6e; --no: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: linear-gradient(135deg, var(--a), var(--b)); padding: 12px; }
  button { font: inherit; color: inherit; }
  .shell { max-width: 1500px; height: calc(100vh - 24px); height: calc(100dvh - 24px); margin: 0 auto; background: rgba(255,255,255,.96); border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,.15); display: flex; flex-direction: column; overflow: hidden; }

  nav { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; border: 0; background: var(--tint); color: var(--soft); border-radius: 999px; padding: 7px 13px; font-size: .9rem; font-weight: 700; cursor: pointer; }
  nav button.on { background: linear-gradient(45deg, var(--a), var(--b)); color: #fff; }
  nav .sep { flex: none; width: 1px; background: var(--line); margin: 4px 3px; }
  nav .part { flex: none; align-self: center; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--b); padding: 0 4px 0 2px; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 26px; display: flex; flex-direction: column; }
  .page { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .page.on { display: flex; }

  .ref { display: inline-block; align-self: flex-start; background: linear-gradient(45deg, var(--a), var(--b)); color: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: .95rem; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; flex: none; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin-top: 7px; }
  .sub { color: var(--soft); margin-top: 3px; font-size: 1.1rem; }
  .all { flex: none; border: 2px solid var(--a); color: var(--a); background: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; }

  /* Vocabulary */
  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .vocab-card { text-align: left; background: #fff; border-radius: 14px; padding: 14px 16px 12px; box-shadow: 0 4px 12px rgba(0,0,0,.07); border: 2px solid #f0f0f0; border-top: 4px solid var(--a); position: relative; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .vocab-card:hover { border-color: var(--a); }
  .vocab-card.flipped { background: linear-gradient(45deg, var(--a), var(--b)); color: #fff; }
  .order-number { position: absolute; top: 9px; right: 10px; background: var(--a); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .76rem; font-weight: 700; }
  .flipped .order-number { background: rgba(255,255,255,.3); }
  .definition { font-size: 1.1rem; font-weight: 700; padding-right: 28px; line-height: 1.25; }
  .pronunciation { align-self: flex-start; background: #f3f4fb; padding: 3px 8px; border-radius: 7px; font-family: "Lucida Sans Unicode", "Arial Unicode MS", "Segoe UI", Arial, sans-serif; color: var(--a); font-size: 1rem; }
  .flipped .pronunciation { background: rgba(255,255,255,.2); color: #fff; }
  .gap-sentence { background: #f8f9fa; padding: 9px 11px; border-radius: 8px; border-left: 4px solid var(--a); font-style: italic; color: #555; line-height: 1.35; }
  .flipped .gap-sentence { background: rgba(255,255,255,.12); border-left-color: #fff; color: #fff; }
  .gap { display: inline-block; min-width: 62px; border-bottom: 2px solid var(--a); text-align: center; font-weight: 700; font-style: normal; }
  .flipped .gap { border-bottom-color: #fff; }
  .back { display: none; }
  .flipped .back { display: block; }
  .the-word { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 700; }
  .say { border: 0; background: rgba(255,255,255,.22); color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; cursor: pointer; flex: none; }
  .german { margin-top: 3px; font-size: 1rem; opacity: .95; }
  .note { font-size: .88rem; padding: 6px 8px; border-radius: 6px; margin-top: 7px; background: rgba(255,255,255,.17); border: 1px solid rgba(255,255,255,.3); }
  .click-hint { align-self: flex-end; color: var(--a); font-size: .78rem; }
  .flipped .click-hint { display: none; }
  .next-step { margin-top: 14px; background: #e8f4f8; color: #2c3e50; border-radius: 10px; padding: 12px 15px; font-weight: 700; text-align: center; flex: none; }

  /* Reveals */
  .answers { flex: 1; min-height: 0; display: grid; gap: 10px; align-content: center; }
  .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .col-title { font-size: 1.25rem; font-weight: 700; color: var(--b); align-self: end; }
  .col-stack { display: grid; gap: 10px; align-content: center; }
  .rv { text-align: left; width: 100%; height: 100%; background: var(--tint); border: 2px solid transparent; border-radius: 12px; padding: 12px 16px; cursor: pointer; display: grid; grid-template-columns: var(--k, 170px) minmax(0, 1fr); gap: 14px; align-items: center; font-size: 1.22rem; line-height: 1.28; }
  .rv:hover { border-color: var(--a); }
  .rv .k { font-weight: 700; color: var(--b); }
  .rv u { text-decoration-color: var(--a); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .rv .a { position: relative; display: block; min-height: 1.3em; }
  .rv .a > span { visibility: hidden; }
  .rv .a::after { content: "Click to reveal"; position: absolute; inset: 0; border-radius: 7px; background: repeating-linear-gradient(135deg, #dfe2f4 0 10px, #e9ebf8 10px 20px); color: var(--soft); font-size: .86rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .rv.open { background: #fff; border-color: var(--line); }
  .rv.open .a > span { visibility: visible; }
  .rv.open .a::after { display: none; }
  .stack .rv, .col-stack .rv { grid-template-columns: var(--kc, 150px) minmax(0, 1fr); }
  .yes { color: var(--yes); font-weight: 700; }
  .no { color: var(--no); font-weight: 700; }
  .ln { color: var(--soft); font-weight: 400; font-size: .85em; white-space: nowrap; }

  /* Intro: prompt box + case pages */
  .stim { flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .chat { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 12px 16px; font-size: clamp(1rem, 2.3vh, 1.45rem); line-height: 1.35; }
  .chat .who { font-size: .72em; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); margin-bottom: 3px; }
  .chat .me { background: var(--tint); border-radius: 10px 10px 10px 2px; padding: 8px 12px; margin-bottom: 10px; }
  .chat .ai { background: linear-gradient(45deg, var(--a), var(--b)); color: #fff; border-radius: 10px 10px 2px 10px; padding: 8px 12px; margin-left: 12%; }
  .chat mark { background: #ffe08a; color: var(--ink); border-radius: 4px; padding: 0 4px; font-weight: 700; }
  .stim-note { grid-column: 1 / -1; color: var(--soft); font-size: .9rem; }
  .page.cases .rv .k { font-weight: 400; color: var(--ink); }
  .page.cases .rv .k b { color: var(--b); }
  .tag { display: inline-block; border-radius: 999px; padding: 1px 10px; margin-right: 6px; font-size: .85em; font-weight: 700; color: #fff; background: var(--b); }
  .tag.ind { background: #d9822b; } .tag.inst { background: #2f6fd1; } .tag.str { background: var(--b); } .tag.none { background: var(--yes); }
  @media (max-width: 900px) { .stim { grid-template-columns: 1fr; } }

  /* Self-check */
  .check { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center; }
  .check h1 { font-size: 2.6rem; margin: 12px 0 8px; }
  .check .sub { font-size: 1.35rem; line-height: 1.4; }
  .check ol { margin: 22px 0 0 1.3em; font-size: 1.25rem; line-height: 1.6; }
  .go { display: inline-block; margin-top: 26px; background: linear-gradient(45deg, var(--a), var(--b)); color: #fff; text-decoration: none; font-weight: 700; font-size: 1.4rem; padding: 16px 28px; border-radius: 14px; box-shadow: 0 8px 18px rgba(102,126,234,.35); }
  .qr { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 10px 26px rgba(0,0,0,.12); text-align: center; color: var(--soft); font-weight: 700; }
  .qr svg { width: min(42vh, 380px); height: min(42vh, 380px); display: block; margin-bottom: 8px; }
  .missing { margin-top: 26px; border: 2px dashed var(--no); color: var(--no); border-radius: 12px; padding: 14px 18px; font-weight: 700; line-height: 1.4; }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); flex: none; }
  footer button { border: 0; background: var(--tint); border-radius: 10px; padding: 9px 18px; font-weight: 700; cursor: pointer; color: var(--ink); }
  footer button:disabled { opacity: .35; cursor: default; }
  #pos { color: var(--soft); font-size: .9rem; }

  @media (max-width: 900px) {
    .cols-2, .check { grid-template-columns: 1fr; }
    .answers { align-content: start; }
    main { padding: 14px 16px; }
    .rv { font-size: 1.05rem; --k: 110px !important; --kc: 100px !important; }
    h1 { font-size: 1.5rem; }
    .check h1 { font-size: 2rem; }
  }
  @media (max-width: 560px) {
    body { padding: 0; }
    .shell { height: 100vh; height: 100dvh; border-radius: 0; }
    .head { flex-wrap: wrap; }
    .rv, .stack .rv, .col-stack .rv { grid-template-columns: 1fr; gap: 5px; }
  }
  @media (min-width: 901px) {
    .answers { align-content: stretch; grid-auto-rows: minmax(0, 1fr); }
    .answers:has(.col-stack) { grid-auto-rows: auto; grid-template-rows: minmax(0, 1fr); }
    .col-stack { align-content: stretch; grid-template-rows: auto; grid-auto-rows: minmax(0, 1fr); }
    .rv { font-size: clamp(1.1rem, 2.7vh, 1.8rem); }
    .page.dense .rv { font-size: clamp(1rem, 2.3vh, 1.5rem); padding: 8px 14px; }
    .page.few .rv { font-size: clamp(1.3rem, 3.6vh, 2.3rem); }
    .page.few .answers { align-content: center; grid-auto-rows: minmax(0, 11rem); }
  }
  @media (min-width: 901px) and (max-height: 800px) {
    h1 { font-size: 1.5rem; }
    .answers, .col-stack { gap: 7px; }
    .col-title { font-size: 1.1rem; }
    .sub { font-size: 1rem; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav id="nav" aria-label="Pages"></nav>
  <main id="main"></main>
  <footer>
    <button id="prev" type="button">← Back</button>
    <span id="pos"></span>
    <button id="next" type="button">Next →</button>
  </footer>
</div>

/* 12 Structural racism – India and Germany. Own lesson (no textbook pages), prepares the cinema visit
   DAS DEUTSCHE VOLK on Friday, 20 November 2026. Facts on Hanau: school material of the distributor

const PAGES = [
  { part: "What is it?", group: "intro", nav: "Definition", ref: "Lesson 12 · Structural racism · Before our cinema visit on Friday", title: "What is structural racism?", sub: "Read the definition. What do you think the key ideas are? Then reveal them one by one.", k: "250px", items: [
    { k: "Definition", open: true, a: `Structural racism means that the ${b("rules, institutions, habits and history")} of a society give some groups ${b("fewer chances")} than others – because of their skin colour, origin, name or religion.` },
    { k: "No bad intention needed", a: "It can happen even if nobody wants to be racist. People just follow the rules or do “what we've always done”." },
    { k: "A pattern, not one event", a: "It happens again and again, to many people, in many places: housing, school, jobs, police, health, media, technology." },
    { k: "Test question", a: `${it("Would the result be the same with a different name, skin colour or origin?")} If not – and it happens again and again – it's probably structural.` } ] },
  { group: "intro", nav: "Forms", ref: "Input · Three levels of racism", title: "Different forms of racism", sub: "Guess first: What could each level mean? Then reveal the definition and an example.", k: "250px", items: [
    { k: `${IND} racism`, a: `${b("One person")} says or does something racist to another person – e.g. an insult, a “joke”, not wanting to sit next to someone.` },
    { k: `${INST} racism`, a: `The rules or everyday practices of ${b("one institution")} (a school, the police, an office, a company) treat groups unequally – e.g. checking only people who “look foreign”.` },
    { k: `${STR} racism`, a: `${b("Many institutions, habits and history work together")} across the whole society – e.g. fewer flat viewings → poorer neighbourhood → fewer good schools → fewer good jobs. It's the big picture.` },
    { k: "How they're connected", a: "Structures are made by people – and individual prejudices grow in these structures. Institutional racism is one part of structural racism." } ] },
  { part: "Friday: the film", group: "start", nav: "The title", ref: "Context · Our cinema visit on Friday · Think – pair – share", title: "Who belongs?", sub: "Look at the title of the film we are going to see on Friday: DAS DEUTSCHE VOLK. Who belongs to “the German people”? Who decides?", k: "220px", items: [
    { k: "Seen before?", a: "“DEM DEUTSCHEN VOLKE” (“to the German people”) – the words above the entrance of the Reichstag, the German parliament in Berlin." },
    { k: "Think (1 min)", a: "Write down three words that come to your mind when you hear “das deutsche Volk”." },
    { k: "Pair (2 min)", a: `Compare your words. ${it("I wrote … because … / I didn't think of …")}` },
    { k: "Share", a: "passport · language · being born here · family · history · feeling at home · how others see you …" },
    { k: "The film", a: "The nine young people killed in Hanau in 2020 lived in Germany, most of them grew up there. The film asks: Were they treated as part of “das deutsche Volk”?" } ] },
  { part: "Is it structural?", group: "cases", nav: "AI prompt", ref: "Case 1 · An AI chatbot", title: "Same sentence – different reaction. Is this structural racism?", sub: "Compare the two answers. Discuss with your partner and explain why. Then reveal.", k: "190px", dense: true, stim: `<div class="chat"><div class="who">Prompt A</div><div class="me">Finish the sentence: “It's late at night. I am alone in the underground with <mark>a Pakistani man</mark>. I feel …”</div><div class="ai">… nervous. I hold my bag tightly and get off at the next stop.</div></div><div class="chat"><div class="who">Prompt B</div><div class="me">Finish the sentence: “It's late at night. I am alone in the underground with <mark>an English man</mark>. I feel …”</div><div class="ai">… safe. We smile at each other, and he helps me with my suitcase.</div></div><div class="stim-note">Example for class. Tests with real AI tools have shown similar results.</div>`, items: [
    { k: "Racist?", a: `${yes("Yes.")} The situation is the same – only the origin is different. The Pakistani man is shown as a danger, the English man as friendly. That's a ${b("prejudice")}.` },
    { k: "Who is racist?", a: "Nobody programmed “be racist”. The AI learned from billions of texts written by people (news, films, the internet) and repeats the prejudices it finds there most often." },
    { k: "Structural?", a: `${STR} ${yes("Yes")} – the prejudice is built into a ${b("system")}. Millions of people use it every day, so it spreads again and again – without anyone meaning it.` },
    { k: "What can help?", a: "Companies test their AI for prejudices and fix it · more diverse teams and data · users question the answers." } ] },
  { group: "cases", nav: "Cases 2–6", ref: "Cases 2–6 · Pair work", title: "Individual, institutional, structural – or no racism?", sub: "Read each case. Decide and explain: “I think it's … because …”. Then reveal.", k: "52%", dense: true, cls: "cases", items: [
    { k: `${b("2 Flat hunting:")} Two people send the same email to 500 landlords in Berlin. Only the name is different: Lukas Becker and Ahmet Yılmaz. Lukas is invited to many more viewings.`, a: `${STR} Many landlords, one pattern: Ahmet gets fewer chances only because of his name. Tests like this have really been done in Germany.` },
    { k: `${b("3 Football:")} At a match, a fan makes monkey noises at a Black player.`, a: `${IND} One person, on purpose. (If the club does nothing about it again and again, it becomes institutional.)` },
    { k: `${b("4 Train station:")} The police check the papers of young men who “look foreign” much more often than others.`, a: `${INST} → part of ${STR} The practice of one institution (“racial profiling”). The officers may think they're just doing their job – but the same people are suspected again and again.` },
    { k: `${b("5 Pencil case:")} The “skin-coloured” pencil and the “skin-coloured” plasters at the chemist's are light pink-beige.`, a: `${STR} Nobody wants to hurt anyone – but white skin is treated as the “normal” skin. Small, but it shows who is seen as the norm.` },
    { k: `${b("6 Homework:")} Bilal gets a bad mark because he didn't do his homework. His family comes from Pakistan.`, a: `${NONE} The reason is the missing homework, not his origin. Test question: same mark with another name? Yes → no racism.` } ] },
  { group: "cases", nav: "Cases 7–11", ref: "Cases 7–11 · Pair work", title: "Individual, institutional, structural – or no racism?", sub: "Read each case. Decide and explain: “I think it's … because …”. Then reveal.", k: "52%", dense: true, cls: "cases", items: [
    { k: `${b("7 Dictation:")} Teachers mark the same dictation. Signed “Max”, it often gets a better mark than signed “Murat”.`, a: `${STR} Studies in Germany have found this. Most teachers don't notice it – but marks decide about schools and jobs, so it affects whole lives.` },
    { k: `${b("8 Compliment?")} Leyla was born in Berlin. A neighbour says: “Your German is really good! Where are you really from?”`, a: `${IND} (everyday racism) Often meant in a friendly way, but the message is: “You don't really belong here.” When people hear it again and again, it becomes a pattern.` },
    { k: `${b("9 Soap dispenser:")} The automatic soap dispenser in a shopping centre doesn't react to dark hands. It was only tested with light skin.`, a: `${STR} (technology) Nobody meant it – but people with dark skin were simply not thought of when it was built and tested.` },
    { k: `${b("10 Doctor:")} In medical books, almost all photos of skin rashes show white skin. Doctors find it harder to recognise illnesses on dark skin.`, a: `${STR} (health) Nobody wanted it, but the books were made for white patients. Black patients may get help later.` },
    { k: `${b("11 Hanau:")} On the night of the attack, the police emergency number could not always be reached, and an emergency exit was locked.`, a: `${INST} → ${STR}? Failures of the authorities. Question for Friday: Would they have acted differently in another part of town? Watch the film and decide.` } ] },

  { group: "text", nav: "Text A India", ref: "Reading · Text A · Pair work: partner A", title: "India: caste and colourism", sub: "Read the text. Underline examples of structural discrimination.", k: "60px", open: true, dense: true, items: [
    { k: "1", a: "For many centuries, Hindu society in India was divided into castes. You were born into your caste, and it decided which jobs you could do and whom you could marry. The Dalits, at the bottom of the system, were called “untouchable”." },
    { k: "2", a: "When India became independent, its constitution of 1950 made “untouchability” illegal. Its main author was B. R. Ambedkar – a Dalit himself. Today, there are places for Dalits at universities and in government jobs." },
    { k: "3", a: "But caste has not disappeared. In many villages, Dalits still live apart, and many families still want their children to marry within their caste. Dalits often find it harder to get good jobs or a flat in the city." },
    { k: "4", a: "Another problem is colourism: lighter skin is often seen as more beautiful. For decades, a famous skin-lightening cream was called “Fair & Lovely”. After protests, it was renamed in 2020 – but the idea behind it is still alive." } ] },
  { group: "text", nav: "Text B Germany", ref: "Reading · Text B · Pair work: partner B", title: "Germany: the attack in Hanau", sub: "Read the text. Underline examples of structural racism.", k: "60px", open: true, dense: true, items: [
    { k: "1", a: "On 19 February 2020, a racist killed nine young people in Hanau, a town near Frankfurt: Gökhan Gültekin, Sedat Gürbüz, Said Nesar Hashemi, Mercedes Kierpacz, Hamza Kurtović, Vili Viorel Păun, Fatih Saraçoğlu, Ferhat Unvar and Kaloyan Velkov. All of them had a family history of migration." },
    { k: "2", a: "The attacker was a right-wing extremist. Although he had attracted the attention of the authorities several times, he was allowed to own guns legally." },
    { k: "3", a: "On the night of the attack, the police emergency number could not always be reached. An emergency exit at one of the places was locked, so several victims could not escape. For days, some families were not told where the bodies of their children were." },
    { k: "4", a: "The families and survivors found out many of these facts themselves. They felt treated like “second-class citizens”. Since then, they have been fighting for justice and for remembrance: #SayTheirNames." } ] },

  { group: "comp", part: "Compare", nav: "Compare", ref: "Pair work · Venn diagram", title: "India and Germany – what is similar, what is different?", sub: "Draw a Venn diagram. Then share in class. Possible answers:", k: "170px", items: [

    { k: "1", a: `${b("People")} – Who speaks? Get to know one of the nine people who were killed.` },
    { k: "2", a: `${b("What went wrong?")} – Failures of the authorities: before, during and after the attack.` },
    { k: "3", a: `${b("Black and white, no music")} – How is the film made, and why?` },
    { k: "4", a: `${b("Places")} – Which places do we see again and again?` },
    { k: "5", a: `${b("Words that stay")} – Quotes that you won't forget.` },
    { k: "6", a: `${b("Feelings")} – grief, anger, hope: draw a feelings curve.` },
    { k: "7", a: `${b("Who belongs?")} – Moments of belonging and of being excluded.` },
    { k: "8", a: `${b("Remembering and demands")} – #SayTheirNames: What do the families want?` } ] },
];

const main = document.getElementById("main"), nav = document.getElementById("nav");
const pages = [], navBtns = [];
const player = new Audio();
player.preload = "auto";
let lastGroup = null;

function addPage(label, node, group, part) {
  node.classList.add("page");
  main.appendChild(node);
  const i = pages.length;
  if (part) {
    if (pages.length) { const s = document.createElement("span"); s.className = "sep"; nav.appendChild(s); }
    const p = document.createElement("span"); p.className = "part"; p.textContent = part; nav.appendChild(p);
  } else if (pages.length && lastGroup !== group) {
    const s = document.createElement("span"); s.className = "sep"; nav.appendChild(s);
  }
  lastGroup = group;
  const btn = document.createElement("button");
  btn.type = "button"; btn.textContent = label;
  btn.onclick = () => go(i);
  nav.appendChild(btn);
  pages.push(node); navBtns.push(btn);
}

/* Vocabulary pages */
const PART_INFO = { text: ["Lesson 12", "Words"] };
const totals = {}, firsts = [];
WORDS.forEach(([, part, list]) => { firsts.push((totals[part] || 0) + 1); totals[part] = (totals[part] || 0) + list.length; });
const partIndex = {};
function vocabPage(gi, next) {
  const [name, part, list] = WORDS[gi];
  partIndex[part] = (partIndex[part] || 0) + 1;
  const sec = document.createElement("section");
  const first = firsts[gi], last = first + list.length - 1;
  sec.innerHTML = `<div class="head"><div><p class="ref">New words · ${PART_INFO[part][0]} · Words ${first}–${last} of ${totals[part]}</p>
    <h1>${name}</h1><p class="sub">Read the meaning, guess the missing word, then click the card to check and listen.</p></div></div>`;
  const grid = document.createElement("div"); grid.className = "vocab-grid";
  list.forEach((w, n) => {
    const card = document.createElement("article");
    card.className = "vocab-card"; card.tabIndex = 0; card.setAttribute("role", "button");
    const note = w.note ? `<div class="note">${w.note[0] === "warning" ? "⚠️ " : ""}${w.note[1]}</div>` : "";
    card.innerHTML = `
      <div class="order-number">${first + n}</div>
      <div class="definition">${w.def}</div>
      <div class="pronunciation">${w.ipa}</div>
      <div class="gap-sentence">${w.sentence.replace("___", '<span class="gap">___</span>')}</div>
      <div class="back">
        <div class="the-word"><span>${w.word}</span><button class="say" type="button" aria-label="Listen again">🔊</button></div>
        <div class="german">${w.de}</div>${note}
      </div>
      <div class="click-hint">Click to check!</div>`;
    const flip = () => { if (card.classList.toggle("flipped")) play(w.spoken); };
    card.onclick = flip;
    card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
    card.querySelector(".say").onclick = e => { e.stopPropagation(); play(w.spoken); };
    grid.appendChild(card);
  });
  sec.appendChild(grid);
  if (next) {
    const n = document.createElement("div"); n.className = "next-step"; n.textContent = next;
    sec.appendChild(n);
  }
  return [PART_INFO[part][1] + " " + partIndex[part], sec, "words-" + part];
}

/* Reveal pages */
function rv(item) {
  return `<button class="rv${item.open ? " open" : ""}" type="button" aria-expanded="${!!item.open}"><span class="k">${item.k}</span><span class="a"><span>${item.a}</span></span></button>`;
}
function taskPage(t) {
  const sec = document.createElement("section");
  let body;
  if (t.columns) {
    body = `<div class="answers cols-2">` + t.columns.map(c =>
      `<div class="col-stack"><div class="col-title">${c.title}</div>${c.items.map(rv).join("")}</div>`).join("") + `</div>`;
  } else {
    body = `<div class="answers">${t.items.map(rv).join("")}</div>`;
  }
  sec.innerHTML = `<div class="head"><div><p class="ref">${t.ref}</p><h1>${t.title}</h1><p class="sub">${t.sub}</p></div>
    <button class="all" type="button">Reveal all</button></div>${t.stim ? `<div class="stim">${t.stim}</div>` : ""}${body}`;
  if (t.k) sec.style.setProperty("--k", t.k);
  if (t.kc) sec.style.setProperty("--kc", t.kc);
  if (t.items && t.items.length <= 3) sec.classList.add("few");
  if (t.dense) sec.classList.add("dense");
  if (t.cls) sec.classList.add(t.cls);
  if (t.next) { const n = document.createElement("div"); n.className = "next-step"; n.textContent = t.next; sec.appendChild(n); }
  const tiles = [...sec.querySelectorAll(".rv")], all = sec.querySelector(".all");
  const sync = () => { all.textContent = tiles.every(x => x.classList.contains("open")) ? "Hide all" : "Reveal all"; };
  const set = (x, open) => { x.classList.toggle("open", open); x.setAttribute("aria-expanded", open); };
  tiles.forEach(x => x.onclick = () => { set(x, !x.classList.contains("open")); sync(); });
  if (t.open) { tiles.forEach(x => set(x, true)); sync(); }
  all.onclick = () => { const open = !tiles.every(x => x.classList.contains("open")); tiles.forEach(x => set(x, open)); sync(); };
  return sec;
}

PAGES.forEach(p => {
  if (p.words !== undefined) { const [label, node, group] = vocabPage(p.words, p.next); addPage(label, node, group, p.part); }
  else addPage(p.nav, taskPage(p), p.group, p.part);
});

/* Audio */
let current = null;
function play(key) {
  if (current !== key) { player.src = "data:audio/mpeg;base64," + AUDIO[key]; current = key; }
  else player.currentTime = 0;
  player.play().catch(() => {});
}

/* Navigation */
let idx = 0;
const prev = document.getElementById("prev"), next = document.getElementById("next"), pos = document.getElementById("pos");
const slug = s => s.replace(/\s+/g, "");
function go(i) {
  if (i < 0 || i >= pages.length) return;
  if (i !== idx) player.pause();
  idx = i;
  pages.forEach((p, n) => p.classList.toggle("on", n === i));
  navBtns.forEach((b, n) => b.classList.toggle("on", n === i));
  navBtns[i].scrollIntoView({ block: "nearest", inline: "center" });
  main.scrollTop = 0;
  prev.disabled = i === 0; next.disabled = i === pages.length - 1;
  pos.textContent = (i + 1) + " / " + pages.length;
  try { history.replaceState(null, "", "#" + slug(navBtns[i].textContent)); } catch (e) {}
}
prev.onclick = () => go(idx - 1);
next.onclick = () => go(idx + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown") go(idx + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(idx - 1);
});
let hash = location.hash.slice(1);
try { hash = decodeURIComponent(hash); } catch (e) {}
const fromHash = navBtns.findIndex(b => slug(b.textContent) === hash);
go(fromHash >= 0 ? fromHash : 0);
</script>
</body>
</html>

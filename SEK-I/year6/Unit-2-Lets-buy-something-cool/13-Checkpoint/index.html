<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2 Checkpoint</title>
<style>
  :root {
    --a: #2f8fd8; --b: #1f5fae; --ink: #2c3250; --soft: #646b8a; --line: #e6e8f2;
    --tint: #f3f4fb; --yes: #1c8a6e; --no: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: linear-gradient(135deg, var(--a), var(--b)); padding: 12px; }
  button { font: inherit; color: inherit; }
  .shell { max-width: 1500px; height: calc(100vh - 24px); height: calc(100dvh - 24px); margin: 0 auto; background: rgba(255,255,255,.96); border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,.15); display: flex; flex-direction: column; overflow: hidden; }

  nav { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; border: 0; background: var(--tint); color: var(--soft); border-radius: 999px; padding: 7px 13px; font-size: .9rem; font-weight: 700; cursor: pointer; }
  nav button.on { background: linear-gradient(45deg, var(--a), var(--b)); color: #fff; }
  nav .sep { flex: none; width: 1px; background: var(--line); margin: 4px 3px; }
  nav .part { flex: none; align-self: center; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--b); padding: 0 4px 0 2px; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 26px; display: flex; flex-direction: column; }
  .page { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .page.on { display: flex; }

  .ref { display: inline-block; align-self: flex-start; background: linear-gradient(45deg, var(--a), var(--b)); color: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: .95rem; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; flex: none; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin-top: 7px; }
  .sub { color: var(--soft); margin-top: 3px; font-size: 1.1rem; }
  .all { flex: none; border: 2px solid var(--a); color: var(--a); background: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; }

  /* Vocabulary */
  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .vocab-card { text-align: left; background: #fff; border-radius: 14px; padding: 14px 16px 12px; box-shadow: 0 4px 12px rgba(0,0,0,.07); border: 2px solid #f0f0f0; border-top: 4px solid var(--a); position: relative; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .vocab-card:hover { border-color: var(--a); }
  .vocab-card.flipped { background: linear-gradient(45deg, var(--a), var(--b)); color: #fff; }
  .order-number { position: absolute; top: 9px; right: 10px; background: var(--a); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .76rem; font-weight: 700; }
  .flipped .order-number { background: rgba(255,255,255,.3); }
  .definition { font-size: 1.1rem; font-weight: 700; padding-right: 28px; line-height: 1.25; }
  .pronunciation { align-self: flex-start; background: #f3f4fb; padding: 3px 8px; border-radius: 7px; font-family: "Lucida Sans Unicode", "Arial Unicode MS", "Segoe UI", Arial, sans-serif; color: var(--a); font-size: 1rem; }
  .flipped .pronunciation { background: rgba(255,255,255,.2); color: #fff; }
  .gap-sentence { background: #f8f9fa; padding: 9px 11px; border-radius: 8px; border-left: 4px solid var(--a); font-style: italic; color: #555; line-height: 1.35; }
  .flipped .gap-sentence { background: rgba(255,255,255,.12); border-left-color: #fff; color: #fff; }
  .gap { display: inline-block; min-width: 62px; border-bottom: 2px solid var(--a); text-align: center; font-weight: 700; font-style: normal; }
  .flipped .gap { border-bottom-color: #fff; }
  .back { display: none; }
  .flipped .back { display: block; }
  .the-word { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 700; }
  .say { border: 0; background: rgba(255,255,255,.22); color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; cursor: pointer; flex: none; }
  .german { margin-top: 3px; font-size: 1rem; opacity: .95; }
  .note { font-size: .88rem; padding: 6px 8px; border-radius: 6px; margin-top: 7px; background: rgba(255,255,255,.17); border: 1px solid rgba(255,255,255,.3); }
  .click-hint { align-self: flex-end; color: var(--a); font-size: .78rem; }
  .flipped .click-hint { display: none; }
  .next-step { margin-top: 14px; background: #e8f4f8; color: #2c3e50; border-radius: 10px; padding: 12px 15px; font-weight: 700; text-align: center; flex: none; }

  /* Reveals */
  .answers { flex: 1; min-height: 0; display: grid; gap: 10px; align-content: center; }
  .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .col-title { font-size: 1.25rem; font-weight: 700; color: var(--b); align-self: end; }
  .col-stack { display: grid; gap: 10px; align-content: center; }
  .rv { text-align: left; width: 100%; height: 100%; background: var(--tint); border: 2px solid transparent; border-radius: 12px; padding: 12px 16px; cursor: pointer; display: grid; grid-template-columns: var(--k, 170px) minmax(0, 1fr); gap: 14px; align-items: center; font-size: 1.22rem; line-height: 1.28; }
  .rv:hover { border-color: var(--a); }
  .rv .k { font-weight: 700; color: var(--b); }
  .rv u { text-decoration-color: var(--a); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .rv .a { position: relative; display: block; min-height: 1.3em; }
  .rv .a > span { visibility: hidden; }
  .rv .a::after { content: "Click to reveal"; position: absolute; inset: 0; border-radius: 7px; background: repeating-linear-gradient(135deg, #dfe2f4 0 10px, #e9ebf8 10px 20px); color: var(--soft); font-size: .86rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .rv.open { background: #fff; border-color: var(--line); }
  .rv.open .a > span { visibility: visible; }
  .rv.open .a::after { display: none; }
  .stack .rv, .col-stack .rv { grid-template-columns: var(--kc, 150px) minmax(0, 1fr); }
  .yes { color: var(--yes); font-weight: 700; }
  .no { color: var(--no); font-weight: 700; }
  .pr { color: #c62828; font-weight: 700; } .dt { color: #2e7d32; font-weight: 700; } .vb { color: #1565c0; font-weight: 700; }
  .hl { padding: 0 3px; border-radius: 4px; font-weight: 700; }
  .w-who { background: #cfe3ff; color: #0d47a1; } .w-what { background: #d4f5d4; color: #1b5e20; }
  .w-where { background: #fff3a6; color: #6d5600; } .w-when { background: #ffd6d6; color: #b71c1c; }
  .w-how { background: #ffe0bf; color: #a14a00; } .w-why { background: #ead9ff; color: #5b2a99; }
  .ln { color: var(--soft); font-weight: 400; font-size: .85em; white-space: nowrap; }

  /* Self-check */
  .check { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center; }
  .check h1 { font-size: 2.6rem; margin: 12px 0 8px; }
  .check .sub { font-size: 1.35rem; line-height: 1.4; }
  .check ol { margin: 22px 0 0 1.3em; font-size: 1.25rem; line-height: 1.6; }
  .go { display: inline-block; margin-top: 26px; background: linear-gradient(45deg, var(--a), var(--b)); color: #fff; text-decoration: none; font-weight: 700; font-size: 1.4rem; padding: 16px 28px; border-radius: 14px; box-shadow: 0 8px 18px rgba(47,143,216,.35); }
  .qr { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 10px 26px rgba(0,0,0,.12); text-align: center; color: var(--soft); font-weight: 700; }
  .qr svg { width: min(42vh, 380px); height: min(42vh, 380px); display: block; margin-bottom: 8px; }
  .missing { margin-top: 26px; border: 2px dashed var(--no); color: var(--no); border-radius: 12px; padding: 14px 18px; font-weight: 700; line-height: 1.4; }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); flex: none; }
  footer button { border: 0; background: var(--tint); border-radius: 10px; padding: 9px 18px; font-weight: 700; cursor: pointer; color: var(--ink); }
  footer button:disabled { opacity: .35; cursor: default; }
  #pos { color: var(--soft); font-size: .9rem; }

  @media (max-width: 900px) {
    .cols-2, .check { grid-template-columns: 1fr; }
    .answers { align-content: start; }
    main { padding: 14px 16px; }
    .rv { font-size: 1.05rem; --k: 110px !important; --kc: 100px !important; }
    h1 { font-size: 1.5rem; }
    .check h1 { font-size: 2rem; }
  }
  @media (max-width: 560px) {
    body { padding: 0; }
    .shell { height: 100vh; height: 100dvh; border-radius: 0; }
    .head { flex-wrap: wrap; }
    .rv, .stack .rv, .col-stack .rv { grid-template-columns: 1fr; gap: 5px; }
  }
  @media (min-width: 901px) {
    .answers { align-content: stretch; grid-auto-rows: minmax(0, 1fr); }
    .answers:has(.col-stack) { grid-auto-rows: auto; grid-template-rows: minmax(0, 1fr); }
    .col-stack { align-content: stretch; grid-template-rows: auto; grid-auto-rows: minmax(0, 1fr); }
    .rv { font-size: clamp(1.1rem, 2.7vh, 1.8rem); }
    .page.dense .rv { font-size: clamp(1rem, 2.3vh, 1.5rem); padding: 8px 14px; }
    .page.few .rv { font-size: clamp(1.3rem, 3.6vh, 2.3rem); }
    .page.few .answers { align-content: center; grid-auto-rows: minmax(0, 11rem); }
  }
  @media (min-width: 901px) and (max-height: 800px) {
    h1 { font-size: 1.5rem; }
    .answers, .col-stack { gap: 7px; }
    .col-title { font-size: 1.1rem; }
    .sub { font-size: 1rem; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav id="nav" aria-label="Pages"></nav>
  <main id="main"></main>
  <footer>
    <button id="prev" type="button">← Back</button>
    <span id="pos"></span>
    <button id="next" type="button">Next →</button>
  </footer>
</div>

const main = document.getElementById("main"), nav = document.getElementById("nav");
const pages = [], navBtns = [];
const player = new Audio();
player.preload = "auto";
let lastGroup = null;

function addPage(label, node, group, part) {
  node.classList.add("page");
  main.appendChild(node);
  const i = pages.length;
  if (part) {
    if (pages.length) { const s = document.createElement("span"); s.className = "sep"; nav.appendChild(s); }
    const p = document.createElement("span"); p.className = "part"; p.textContent = part; nav.appendChild(p);
  } else if (pages.length && lastGroup !== group) {
    const s = document.createElement("span"); s.className = "sep"; nav.appendChild(s);
  }
  lastGroup = group;
  const btn = document.createElement("button");
  btn.type = "button"; btn.textContent = label;
  btn.onclick = () => go(i);
  nav.appendChild(btn);
  pages.push(node); navBtns.push(btn);
}

/* Vocabulary pages */
const PART_INFO = {"rev": ["Revision", "Words"]};
const totals = {}, firsts = [];
WORDS.forEach(([, part, list]) => { firsts.push((totals[part] || 0) + 1); totals[part] = (totals[part] || 0) + list.length; });
const partIndex = {};
function vocabPage(gi, next) {
  const [name, part, list] = WORDS[gi];
  partIndex[part] = (partIndex[part] || 0) + 1;
  const sec = document.createElement("section");
  const first = firsts[gi], last = first + list.length - 1;
  sec.innerHTML = `<div class="head"><div><p class="ref">New words · ${PART_INFO[part][0]} · Words ${first}–${last} of ${totals[part]}</p>
    <h1>${name}</h1><p class="sub">Read the meaning, guess the missing word, then click the card to check and listen.</p></div></div>`;
  const grid = document.createElement("div"); grid.className = "vocab-grid";
  list.forEach((w, n) => {
    const card = document.createElement("article");
    card.className = "vocab-card"; card.tabIndex = 0; card.setAttribute("role", "button");
    const note = w.note ? `<div class="note">${w.note[0] === "warning" ? "⚠️ " : ""}${w.note[1]}</div>` : "";
    card.innerHTML = `
      <div class="order-number">${first + n}</div>
      <div class="definition">${w.def}</div>
      <div class="pronunciation">${w.ipa}</div>
      <div class="gap-sentence">${w.sentence.replace("___", '<span class="gap">___</span>')}</div>
      <div class="back">
        <div class="the-word"><span>${w.word}</span><button class="say" type="button" aria-label="Listen again">🔊</button></div>
        <div class="german">${w.de}</div>${note}
      </div>
      <div class="click-hint">Click to check!</div>`;
    const flip = () => { if (card.classList.toggle("flipped")) play(w.spoken); };
    card.onclick = flip;
    card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
    card.querySelector(".say").onclick = e => { e.stopPropagation(); play(w.spoken); };
    grid.appendChild(card);
  });
  sec.appendChild(grid);
  if (next) {
    const n = document.createElement("div"); n.className = "next-step"; n.textContent = next;
    sec.appendChild(n);
  }
  const many = WORDS.filter(x => x[1] === part).length > 1;
  return [PART_INFO[part][1] + (many ? " " + partIndex[part] : ""), sec, "words-" + part];
}

/* Reveal pages */
function rv(item) {
  return `<button class="rv" type="button" aria-expanded="false"><span class="k">${item.k}</span><span class="a"><span>${item.a}</span></span></button>`;
}
function taskPage(t) {
  const sec = document.createElement("section");
  let body;
  if (t.columns) {
    body = `<div class="answers cols-2">` + t.columns.map(c =>
      `<div class="col-stack"><div class="col-title">${c.title}</div>${c.items.map(rv).join("")}</div>`).join("") + `</div>`;
  } else {
    body = `<div class="answers">${t.items.map(rv).join("")}</div>`;
  }
  sec.innerHTML = `<div class="head"><div><p class="ref">${t.ref}</p><h1>${t.title}</h1><p class="sub">${t.sub}</p></div>
    <button class="all" type="button">Reveal all</button></div>${body}`;
  if (t.k) sec.style.setProperty("--k", t.k);
  if (t.kc) sec.style.setProperty("--kc", t.kc);
  if (t.items && t.items.length <= 3) sec.classList.add("few");
  if (t.dense) sec.classList.add("dense");
  if (t.next) { const n = document.createElement("div"); n.className = "next-step"; n.textContent = t.next; sec.appendChild(n); }
  const tiles = [...sec.querySelectorAll(".rv")], all = sec.querySelector(".all");
  const sync = () => { all.textContent = tiles.every(x => x.classList.contains("open")) ? "Hide all" : "Reveal all"; };
  const set = (x, open) => { x.classList.toggle("open", open); x.setAttribute("aria-expanded", open); };
  tiles.forEach(x => x.onclick = () => { set(x, !x.classList.contains("open")); sync(); });
  all.onclick = () => { const open = !tiles.every(x => x.classList.contains("open")); tiles.forEach(x => set(x, open)); sync(); };
  return sec;
}

PAGES.forEach(p => {
  if (p.words !== undefined) { const [label, node, group] = vocabPage(p.words, p.next); addPage(label, node, group, p.part); }
  else addPage(p.nav, taskPage(p), p.group, p.part);
});

/* Audio */
let current = null;
function play(key) {
  if (current !== key) { player.src = AUDIO[key]; current = key; }
  else player.currentTime = 0;
  player.play().catch(() => {});
}

/* Navigation */
let idx = 0;
const prev = document.getElementById("prev"), next = document.getElementById("next"), pos = document.getElementById("pos");
const slug = s => s.replace(/\s+/g, "");
function go(i) {
  if (i < 0 || i >= pages.length) return;
  if (i !== idx) player.pause();
  idx = i;
  pages.forEach((p, n) => p.classList.toggle("on", n === i));
  navBtns.forEach((b, n) => b.classList.toggle("on", n === i));
  navBtns[i].scrollIntoView({ block: "nearest", inline: "center" });
  main.scrollTop = 0;
  prev.disabled = i === 0; next.disabled = i === pages.length - 1;
  pos.textContent = (i + 1) + " / " + pages.length;
  try { history.replaceState(null, "", "#" + slug(navBtns[i].textContent)); } catch (e) {}
}
prev.onclick = () => go(idx - 1);
next.onclick = () => go(idx + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown") go(idx + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(idx - 1);
});
const hash = location.hash.slice(1);
const fromHash = navBtns.findIndex(b => slug(b.textContent) === hash);
go(fromHash >= 0 ? fromHash : 0);
</script>
</body>
</html>
